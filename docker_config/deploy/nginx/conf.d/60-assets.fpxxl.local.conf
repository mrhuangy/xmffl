server {
  listen 80;
  server_name assets.fpxxl.local;

  charset utf-8;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /assets/ {
    alias /var/www/minigame-assets/;

    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*";
    add_header X-Content-Type-Options "nosniff";

    try_files $uri =404;
  }

  location ~ /\. {
    deny all;
  }

  location / {
    return 404;
  }
}
