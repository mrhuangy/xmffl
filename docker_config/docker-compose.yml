name: fpxxl

services:
  mysql:
    image: mysql:8.4
    container_name: fpxxl-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fpxxl}
      MYSQL_USER: ${MYSQL_USER:-fpxxl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fpxxl}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufpxxl", "-pfpxxl"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: fpxxl-backend
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: ${MYSQL_DSN:-fpxxl:fpxxl@tcp(mysql:3306)/fpxxl?parseTime=true&loc=Local}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-*}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-local-development-secret-change-before-production}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minigame-api:
    build:
      context: ../minigame-api
    container_name: fpxxl-minigame-api
    environment:
      HTTP_ADDR: ":8090"
      MYSQL_DSN: ${MYSQL_DSN:-fpxxl:fpxxl@tcp(mysql:3306)/fpxxl?parseTime=true&loc=Local}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-*}
      GIN_MODE: ${GIN_MODE:-release}
      WECHAT_MINIGAME_APPID: ${WECHAT_MINIGAME_APPID:-}
      WECHAT_MINIGAME_SECRET: ${WECHAT_MINIGAME_SECRET:-}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MINIGAME_API_PORT:-8090}:8090"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  admin:
    image: node:20-alpine
    container_name: fpxxl-admin-build
    working_dir: /app
    volumes:
      - ../admin:/app
      - ../admin/dist:/app/dist
    command: sh -c "npm ci --include=dev && npm run build"
    environment:
      NODE_ENV: production
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: fpxxl-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../admin/dist:/var/www/admin:ro
    depends_on:
      admin:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      minigame-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
