services:
  mysql:
    image: mysql:8.4
    container_name: fpxxl-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fpxxl
      MYSQL_USER: fpxxl
      MYSQL_PASSWORD: fpxxl
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufpxxl", "-pfpxxl"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    container_name: fpxxl-backend
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "fpxxl:fpxxl@tcp(mysql:3306)/fpxxl?parseTime=true&loc=Local"
      ALLOW_ORIGIN: "*"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  minigame-api:
    build:
      context: ../minigame-api
    container_name: fpxxl-minigame-api
    environment:
      HTTP_ADDR: ":8090"
      MYSQL_DSN: "fpxxl:fpxxl@tcp(mysql:3306)/fpxxl?parseTime=true&loc=Local"
      ALLOW_ORIGIN: "*"
      GIN_MODE: "release"
      TZ: Asia/Shanghai
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy

  admin:
    build:
      context: ../admin
    container_name: fpxxl-admin
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
