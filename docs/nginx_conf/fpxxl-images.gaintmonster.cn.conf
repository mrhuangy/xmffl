server {
  listen 80;
  listen 443 ssl;
  server_name fpxxl-images.gaintmonster.cn;

  root /data/fpxxl/xmffl/images;

  ssl_certificate  /root/aliyun_ssl/fpxxl-images/fpxxl-images.gaintmonster.cn.pem;
  ssl_certificate_key  /root/aliyun_ssl/fpxxl-images/fpxxl-images.gaintmonster.cn.key;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ /\. {
    deny all;
  }

  location ~* \.(?:png|jpg|jpeg|webp|gif|ico|svg|mp3|wav|ogg|m4a|aac|mp4|webm|woff|woff2|ttf|eot)$ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    try_files $uri =404;
  }

  location / {
    return 404;
  }

  error_log /data/log/nginx/fpxxl-images.gaintmonster.cn.error.log;
  access_log /data/log/nginx/fpxxl-images.gaintmonster.cn.access.log;
}
