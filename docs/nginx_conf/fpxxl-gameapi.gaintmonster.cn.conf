server {
  listen 80;
  listen 443 ssl;
  server_name fpxxl-gameapi.gaintmonster.cn;

  ssl_certificate  /root/aliyun_ssl/fpxxl-gameapi/fpxxl-gameapi.gaintmonster.cn.pem;
  ssl_certificate_key  /root/aliyun_ssl/fpxxl-gameapi/fpxxl-gameapi.gaintmonster.cn.key;

  location = /healthz {
    proxy_pass http://127.0.0.1:8090/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
