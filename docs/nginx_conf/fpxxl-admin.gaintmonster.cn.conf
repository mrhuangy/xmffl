server {
  listen 80;
  listen 443 ssl;
  server_name fpxxl-admin.gaintmonster.cn;

  ssl_certificate  /root/aliyun_ssl/fpxxl-admin.gaintmonster.cn.pem;
  ssl_certificate_key  /root/aliyun_ssl/fpxxl-admin.gaintmonster.cn.key;

  root /data/fpxxl/xmffl/admin/dist;
  index index.html;
  
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
        try_files $uri $uri/ /index.html;
  }

  location ~ /\. { 
      deny all; 
  }
   location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

  error_log /data/log/nginx/fpxxl-admin.gaintmonster.cn.error.log;
  access_log /data/log/nginx/fpxxl-admin.gaintmonster.cn.access.log;
}
