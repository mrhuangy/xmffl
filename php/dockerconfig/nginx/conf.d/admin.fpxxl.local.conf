# admin.fpxxl.local - Vue3 admin frontend
server {
    listen 80;
    server_name admin.fpxxl.local;

    root /var/www/admin;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/admin_access.log main;
    error_log  /var/log/nginx/admin_error.log warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Laravel admin API on the same origin as the Vue application.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass admin_php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/admin-api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 120;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    access_log /var/log/nginx/admin_access.log;
    error_log  /var/log/nginx/admin_error.log;
}
