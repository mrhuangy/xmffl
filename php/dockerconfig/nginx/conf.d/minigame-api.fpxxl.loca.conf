server {
    listen 80;
    server_name minigame-api.fpxxl.local;
    root /var/www/minigame-api/public;
    index index.php;
    charset utf-8;

    location / { 
        try_files $uri $uri/ /index.php?$query_string; 
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass minigame_php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
    location ~ /\. { 
        deny all; 
    }

    access_log /var/log/nginx/minigame-api_access.log;
    error_log  /var/log/nginx/minigame-api_error.log;
}
