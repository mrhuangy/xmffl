# ============================================================
# Redis 7.2 配置 — 营养师平台
# ============================================================

# ── 网络 ────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no

# 密码（生产环境务必设置，与 .env REDIS_PASSWORD 保持一致）
# requirepass your_redis_password

# 最大连接数
maxclients 100

# ── 内存管理 ─────────────────────────────────────────────────
maxmemory 256mb
# 内存淘汰策略：优先淘汰最近最少使用的缓存 key
maxmemory-policy allkeys-lru

# ── 持久化 ───────────────────────────────────────────────────
# RDB 快照（适合缓存场景，队列任务丢失风险可接受）
save 900 1
save 300 10
save 60  10000

rdbcompression yes
rdbchecksum    yes
dbfilename     dump.rdb
dir            /data

# AOF（若 Laravel queue 依赖 Redis，建议开启防止重启丢任务）
appendonly           yes
appendfilename       "appendonly.aof"
appendfsync          everysec    
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size   64mb

# ── 日志 ─────────────────────────────────────────────────────
loglevel notice
logfile ""         

# ── 慢日志 ───────────────────────────────────────────────────
slowlog-log-slower-than 10000  
slowlog-max-len 128

# ── 数据库数量 ────────────────────────────────────────────────
databases 4
# db0 = 默认缓存
# db1 = Session
# db2 = Queue（Laravel queue:work 默认使用 db0，可在 .env 中配 REDIS_QUEUE_DB）
# db3 = 预留
