server {
  listen 80;
  listen 443 ssl;
  server_name fpxxl-admin.gaintmonster.cn;

  ssl_certificate  /root/aliyun_ssl/fpxxl-admin/fpxxl-admin.gaintmonster.cn.pem;
  ssl_certificate_key  /root/aliyun_ssl/fpxxl-admin/fpxxl-admin.gaintmonster.cn.key;

  root /data/fpxxl/xmffl/admin/dist;
  index index.html;
  
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Laravel admin API on the same origin as the Vue application.
  location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9003;
        fastcgi_param SCRIPT_FILENAME /var/www/admin-api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 120;
    }

  location / {
        try_files $uri $uri/ /index.html;
  }

  location ~ /\. { 
      deny all; 
  }
   location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

  error_log /data/log/nginx/fpxxl-admin.gaintmonster.cn.error.log;
  access_log /data/log/nginx/fpxxl-admin.gaintmonster.cn.access.log;
}
